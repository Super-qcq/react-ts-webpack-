name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - name: TypeScript 类型检查
        run: npx tsc --noEmit
      - name: ESLint 检查
        run: npm run lint
      - name: 测试
        run: npm test
      - name: 构建学生系统
        run: npm run build --module=student-system